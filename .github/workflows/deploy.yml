name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RESTART_COMMAND: ${{ secrets.RESTART_COMMAND }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,RESTART_COMMAND
          script: |
            set -e

            source /home/vcxvobej/nodevenv/public_html/sgv_cms/20/bin/activate

            if [ -z "$DEPLOY_PATH" ] || [ -z "$RESTART_COMMAND" ]; then
              echo "Missing DEPLOY_PATH or RESTART_COMMAND"
              exit 1
            fi

            REPO_URL="https://github.com/saigon-valve/sgv_cms.git"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              git clone --branch main "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            git fetch origin main --prune
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo ".env not found"
              exit 1
            fi

            corepack enable
            corepack prepare pnpm@10 --activate

            pnpm install --frozen-lockfile

            pnpm build

            eval "$RESTART_COMMAND"

