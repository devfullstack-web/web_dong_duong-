name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
          RESTART_COMMAND: ${{ secrets.RESTART_COMMAND }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: BRANCH,DEPLOY_PATH,DEPLOY_GH_TOKEN,RESTART_COMMAND
          script: |
            set -e

            if [ -z "$DEPLOY_PATH" ] || [ -z "$RESTART_COMMAND" ]; then
              echo "Missing DEPLOY_PATH or RESTART_COMMAND"
              exit 1
            fi

            REPO_URL="https://github.com/saigon-valve/sgv_cms.git"
            if [ -n "$DEPLOY_GH_TOKEN" ]; then
              REPO_URL="https://x-access-token:$DEPLOY_GH_TOKEN@github.com/saigon-valve/sgv_cms.git"
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              git clone --branch "$BRANCH" "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git remote set-url origin "$REPO_URL"
            git fetch origin "$BRANCH" --prune
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ ! -f .env ]; then
              echo ".env not found"
              exit 1
            fi

            corepack enable
            corepack prepare pnpm@10 --activate
            pnpm install --frozen-lockfile
            pnpm build
            pnpm db:push
            eval "$RESTART_COMMAND"
